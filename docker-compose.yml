version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: intranet
      POSTGRES_PASSWORD: intranet_pass
      POSTGRES_DB: intranet_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://intranet:intranet_pass@db:5432/intranet_db
      NODE_ENV: development
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/usr/src/app

volumes:
  db-data:
